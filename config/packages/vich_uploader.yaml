vich_uploader:
    db_driver: orm
    metadata:
        type: attribute

    mappings:
        galerie_images:
            uri_prefix: /uploads/galerie
            upload_destination: '%kernel.project_dir%/public/uploads/galerie'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        certificats_medicaux:
            uri_prefix: /uploads/certificats
            upload_destination: '%kernel.project_dir%/public/uploads/certificats'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
