security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            
            user_checker: App\Security\UserChecker

            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            logout:
                path: app_logout
                target: app_home

            # https://symfony.com/doc/current/security/impersonating-user.html
            # switch_user: true

    # Hiérarchie officielle Studio Danse 430 (statuts AG, sans nom de personne).
    # Les rôles spécifiques héritent des rôles métier implicites :
    #   ROLE_PRESIDENCE → ROLE_BUREAU + ROLE_ADMIN
    #   ROLE_BUREAU     → ROLE_PROF (+ accès trésorerie/secrétariat) + ROLE_SCANNER
    #   ROLE_SCANNER    → ROLE_USER (accès uniquement au scan d'entrée)
    role_hierarchy:
        ROLE_PROF:                ROLE_USER
        ROLE_SCANNER:             ROLE_USER
        ROLE_TRESORIER:           ROLE_BUREAU
        ROLE_TRESORIER_ADJOINT:   ROLE_BUREAU
        ROLE_SECRETAIRE:          ROLE_BUREAU
        # ROLE_BUREAU regroupe trésorerie & secrétariat ; compat. comptes legacy ROLE_BUREAU en base
        ROLE_BUREAU:              [ROLE_PROF, ROLE_TRESORIER, ROLE_TRESORIER_ADJOINT, ROLE_SECRETAIRE, ROLE_SCANNER]
        ROLE_PRESIDENT:           ROLE_PRESIDENCE
        ROLE_VICE_PRESIDENT:      ROLE_PRESIDENCE
        ROLE_PRESIDENCE:          [ROLE_BUREAU, ROLE_ADMIN]
        # Compatibilité comptes existants créés avant la refonte des rôles

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/verify/email, roles: PUBLIC_ACCESS }
        - { path: ^/activation, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        # Station de scan QR (bénévoles / ados ROLE_SCANNER + bureau)
        - { path: ^/scan, roles: ROLE_SCANNER }
        - { path: ^/admin/event/scan, roles: ROLE_SCANNER }
        # Staff pédagogique et bureau (hiérarchie : un trésorier possède aussi ROLE_BUREAU et ROLE_PROF)
        - { path: ^/admin, roles: ROLE_PROF }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
